# Smoke test for e2e validation
[suite]
name          = "harness_smoke"
runners       = 1
budget_hours  = 0.1
overlap_ratio = 0.0

[build]
compiler = "gcc"
type     = "Debug"
cmake_definitions = [
  "TEST_ALL=OFF",
  "TEST_NIGHTMARE_ALL=OFF",
  "TEST_NIGHTMARE_SMOKE=ON",
]
smp        = { sockets = 1, cores = 2, threads = 1 }
memory_mib = 512

[[tasks]]
name   = "harness_smoke"
mode   = "horizontal"
weight = 1.0

  [tasks.boot]
  duration_ms      = 1000
  drain_grace_ms   = 2000
  stat_interval_ms = 100
  gate_first       = false
  max_boots        = 1
  min_interval_ms  = 0

  [tasks.nightmare]
  intensity = 0.5
  seed_mode = "seedless"
  perturb   = []

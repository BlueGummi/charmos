name: Nightmare flag matrix


on:
  schedule:
    # NOTE: GitHub cron routinely runs late at peak usage times
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      compiler:
        description: "gcc or clang"
        required: false
        default: "clang"

permissions:
  contents: read
  packages: read

concurrency:
  group: nightmare
  cancel-in-progress: false

env:
  COMPILER: ${{ github.event.inputs.compiler || 'clang' }}

jobs:
  flags:
    name: ${{ matrix.scenario.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        scenario:
          - name: NIGHTMARE_LOCKS_SMP8
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_LOCKS=ON
            smp: "sockets=2,cores=2,threads=2"
          - name: NIGHTMARE_LOCKS_UP
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_LOCKS=ON
            smp: "sockets=1,cores=1,threads=1"
          - name: NIGHTMARE_WAKE_SMP8
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_WAKE=ON
            smp: "sockets=2,cores=2,threads=2"
          - name: NIGHTMARE_WAKE_UP
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_WAKE=ON
            smp: "sockets=1,cores=1,threads=1"
          - name: NIGHTMARE_ALL_SMP8
            flags: -DTEST_NIGHTMARE_ALL=ON
            smp: "sockets=2,cores=2,threads=2"
          - name: NIGHTMARE_ALL_KASAN
            flags: -DTEST_NIGHTMARE_ALL=ON -DDEBUG_ASAN=ON
            smp: "sockets=2,cores=2,threads=2"
            compiler: clang

    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:080fa34a28833bd7fa7d3cfe1a5208992c3831ce854ceebb672c34ed5c4f979d
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Resolve scenario settings
        id: cfg
        run: |
          set -euo pipefail
          compiler="${{ matrix.scenario.compiler || '' }}"
          [ -n "$compiler" ] || compiler="$COMPILER"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"
          # Seed is derived from the run and attempt so it is recorded
          echo "seed=0x${{ github.run_id }}${{ github.run_attempt }}" \
              >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10

      - name: Compile
        run: |
          ./scripts/build.sh -t RelWithDebInfo \
            --compiler "${{ steps.cfg.outputs.compiler }}" \
            -- ${{ matrix.scenario.flags }} \
               -DMACHINE_SMP="${{ matrix.scenario.smp }}"

      # Booting and running the harness takes about a minute
      - name: Boot and run the harness
        env:
          TERM: dumb
        run: >
          uv run --locked charm boot
          --timeout 600
          --out-dir results
          --shard ${{ matrix.scenario.name }}
          --scenario ${{ matrix.scenario.name }}
          --seed ${{ steps.cfg.outputs.seed }}
          --compiler ${{ steps.cfg.outputs.compiler }}
          --config "smp=${{ matrix.scenario.smp }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightmare-${{ matrix.scenario.name }}
          path: results/
          retention-days: 30

  report:
    name: Report
    needs: flags
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          pattern: nightmare-*
          path: artifacts

      # --fail-on-error is what turns a failed shard into a failed run
      - name: Parse and aggregate
        run: >
          uv run --locked charm ci aggregate 'artifacts/**/*.ndjson'
          --summary "$GITHUB_STEP_SUMMARY"
          --json report.json
          --fail-on-error

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightmare-report
          path: report.json
          retention-days: 90

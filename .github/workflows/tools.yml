name: Tools

# Test tooling
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'nightmare/**'
      - 'include/ndjson.h'
      - 'include/cmdline.h'
      - 'kernel/cmdline/**'
      - 'kernel/parse.c'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'nightmare/**'
      - 'include/ndjson.h'
      - 'include/cmdline.h'
      - 'kernel/cmdline/**'
      - 'kernel/parse.c'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.11'

      - name: Symlink node for act
        run: ln -sf $(which node) /usr/local/bin/node || true

      - name: Lint
        run: uv run --locked ruff check scripts

      - name: Format check
        run: uv run --locked ruff format --check scripts

      - name: Types
        run: uv run --locked mypy

      # includes the CLI smoke tests and the workflow policy
      - name: Tests
        run: uv run --locked pytest -q

  shell:
    name: Shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7


      # Install shellcheck TODO: maybe find a better way to do this
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ --strip-components=1 -C /usr/local/bin \
              "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: shellcheck
        run: |
          shellcheck --severity=warning \
            scripts/build.sh \
            scripts/run_qemu.sh \
            scripts/symbolize.sh \
            scripts/generate_log.sh

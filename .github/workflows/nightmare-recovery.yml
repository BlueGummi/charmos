name: Nightmare recovery

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: nightmare-recovery
  cancel-in-progress: false

jobs:
  reconcile:
    if: vars.NIGHTMARE_DATABASE_DSN != '' && vars.NIGHTMARE_AWS_ROLE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NIGHTMARE_AWS_ROLE }}
          aws-region: ${{ vars.NIGHTMARE_AWS_REGION }}

      - name: Generate short-lived PostgreSQL credential
        env:
          DATABASE_HOST: ${{ vars.NIGHTMARE_DATABASE_HOST }}
          DATABASE_PORT: ${{ vars.NIGHTMARE_DATABASE_PORT }}
          DATABASE_USER: ${{ vars.NIGHTMARE_DATABASE_USER }}
        run: |
          token=$(aws rds generate-db-auth-token \
            --hostname "$DATABASE_HOST" \
            --port "$DATABASE_PORT" \
            --username "$DATABASE_USER")
          echo "::add-mask::$token"
          echo "PGPASSWORD=$token" >> "$GITHUB_ENV"

      - name: Install production store adapter
        run: python3 -m pip install '.[orchestrator]'

      - name: Reconcile expired lease and pending outbox
        env:
          NIGHTMARE_DATABASE_DSN: ${{ vars.NIGHTMARE_DATABASE_DSN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m charm nightmare recover \
            --repository "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"

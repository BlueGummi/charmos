name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'include/**'
  pull_request:
    paths:
      - 'kernel/**'
      - 'include/**'
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  issues: read
  packages: read
  pull-requests: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:080fa34a28833bd7fa7d3cfe1a5208992c3831ce854ceebb672c34ed5c4f979d
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install cross gcc
        if: matrix.compiler == 'gcc' && runner.arch != 'X64'
        run: apt-get update && apt-get install -y gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu

      - name: Compile Debug
        run: ./scripts/build.sh -t Debug --compiler ${{ matrix.compiler }}

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.compiler }}-Debug
          path: build/charmos-x86_64.iso
          retention-days: 7

      - name: Compile Release
        run: ./scripts/build.sh -t Release --compiler ${{ matrix.compiler }}

      - name: Upload Release artifact
        uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.compiler }}-Release
          path: build/charmos-x86_64.iso
          retention-days: 7

      - name: Compile with all features, diagnostics, and tests enabled
        run: >
          ./scripts/build.sh -t Debug --compiler ${{ matrix.compiler }}
          --
          -DDEBUG_ALL=ON
          -DTEST_ALL=ON
          -DPROFILING_ALL=ON
          -DTEST_NIGHTMARE_ALL=ON
          -DINJECT_ALL=ON

name: Nightmare orchestrator
run-name: ${{ format('Nightmare · {0}', inputs.suite || 'scheduled') }}

on:
  schedule:
    - cron: "0 6 * * 1,3,5"
    - cron: "0 6 * * 2,4,6"
  workflow_dispatch:
    inputs:
      suite:
        description: Committed suite for scheduled/compatibility mode
        required: false
        default: overnight_locks
      source_sha:
        description: Exact repository commit; blank uses the triggering commit
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: nightmare-orchestrator-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNNER_IMAGE: ghcr.io/axvonx/charmos-x86-env@sha256:f65d35505d3e48ffe00651fd5da9a7568c2b266d3acd142c6d38f89ec4d57d1e
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  SUITE_ID: ${{ inputs.suite || (github.event.schedule == '0 6 * * 2,4,6' && 'overnight_wake') || 'overnight_locks' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      accepted: ${{ steps.result.outputs.accepted }}
      build_matrix: ${{ steps.result.outputs.build_matrix }}
      source_sha: ${{ steps.result.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Validate and place
        run: |
          set +e
          uv run --locked charm nightmare plan "$SUITE_ID" \
            --repository "${{ github.repository }}" \
            --source-commit "$SOURCE_SHA" \
            --runner-image "$RUNNER_IMAGE" \
            --out plan.json
          plan_rc=$?
          set -e
          test "$(jq -r '.kind' plan.json)" = accepted
          test "$plan_rc" -eq 0

      - name: Export the plan
        id: result
        run: |
          kind=$(jq -r '.kind' plan.json)
          if [ "$kind" = accepted ]; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
            matrix=$(uv run --locked charm nightmare matrix build plan.json)
            echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(jq -r '.plan.source.commit' plan.json)" >> "$GITHUB_OUTPUT"
          else
            echo 'accepted=false' >> "$GITHUB_OUTPUT"
            echo 'build_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            {
              echo '## Nightmare plan was not accepted'
              echo
              echo '```json'
              jq . plan.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload authoritative plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightmare-plan
          path: |
            plan.json
            attempt.json
          if-no-files-found: ignore
          retention-days: 30

  build:
    needs: plan
    if: needs.plan.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:f65d35505d3e48ffe00651fd5da9a7568c2b266d3acd142c6d38f89ec4d57d1e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          submodules: recursive

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - uses: actions/download-artifact@v8
        with:
          name: nightmare-plan
          path: plan-download

      - name: Compile exactly one accepted build group
        run: |
          uv run --locked charm nightmare build-bundle plan-download/plan.json \
            --group "${{ matrix.bundle_id }}" \
            --build-dir build-orchestrator \
            --out-dir bundle \
            --receipt receipt.json

      - name: Upload immutable build bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            bundle/
            receipt.json
          retention-days: 7

  materialize:
    needs: [plan, build]
    if: always() && needs.plan.outputs.accepted == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      runner_matrix: ${{ steps.matrix.outputs.runner_matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - uses: actions/download-artifact@v8
        with:
          name: nightmare-plan
          path: plan-download

      - uses: actions/download-artifact@v8
        with:
          pattern: nightmare-build-*
          path: builds

      - name: Materialize from accepted receipts
        run: |
          mapfile -t receipts < <(find builds -name receipt.json | sort)
          if [ "${#receipts[@]}" -eq 0 ]; then
            echo "error: no build receipts under builds/" >&2
            exit 2
          fi
          uv run --locked charm nightmare materialize \
            plan-download/plan.json "${receipts[@]}" \
            --out-dir materialized

      - name: Export bounded runner matrix
        id: matrix
        run: |
          matrix=$(uv run --locked charm nightmare matrix runner materialized/plan_bundle.json)
          echo "runner_matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: nightmare-plan-bundle
          path: materialized/
          retention-days: 30

  runner:
    needs: [plan, materialize]
    if: needs.materialize.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.materialize.outputs.runner_matrix) }}
    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:f65d35505d3e48ffe00651fd5da9a7568c2b266d3acd142c6d38f89ec4d57d1e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          submodules: recursive

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - uses: actions/download-artifact@v8
        with:
          name: nightmare-plan-bundle
          path: plan-bundle

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.bundle_artifact }}
          path: build-download

      - name: Execute manifest
        run: |
          uv run --locked charm nightmare run-manifest \
            "plan-bundle/manifests/${{ matrix.manifest_id }}.json" \
            --bundle build-download/bundle \
            --build-dir unused-build-dir \
            --out-dir runner-result

      - name: Retain result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.manifest_artifact }}
          path: |
            runner-result/identity.json
            runner-result/manifest.json
            runner-result/runner_result.json
            runner-result/campaign_report.json
            runner-result/campaign_summary.md
            runner-result/**/cmdline.txt
            runner-result/**/console.log
            runner-result/**/machine.nd.log
            runner-result/**/trace.log
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [plan, build, materialize, runner]
    if: always() && needs.plan.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - uses: actions/download-artifact@v8
        with:
          name: nightmare-plan
          path: plan-download

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: nightmare-plan-bundle
          path: plan-bundle

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: nightmare-build-*
          path: builds

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: nightmare-result-*
          path: results

      - name: Verify completeness and render findings
        run: |
          extra=()
          [ ! -f plan-bundle/plan_bundle.json ] || extra+=(--plan-bundle plan-bundle/plan_bundle.json)
          [ ! -d builds ] || extra+=(--builds-dir builds)
          uv run --locked charm nightmare aggregate \
            plan-download/plan.json results \
            "${extra[@]}" \
            --json nightmare-report.json \
            --markdown nightmare-summary.md \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightmare-report
          path: |
            nightmare-report.json
            nightmare-summary.md
          if-no-files-found: warn
          retention-days: 90

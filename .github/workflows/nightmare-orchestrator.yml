name: Nightmare orchestrator
run-name: ${{ inputs.queued_run_id && format('Nightmare · {0} · claim-{1}', inputs.batch_id, inputs.queued_run_id) || format('Nightmare · {0}', inputs.batch_id || inputs.suite || 'scheduled') }}

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      batch_id:
        description: Stable caller-generated identity for one atomic batch
        required: false
        default: ''
      suite:
        description: Committed suite for scheduled/compatibility mode
        required: false
        default: overnight_locks
      batch_toml:
        description: Inline TOML batch definition for direct ad-hoc execution; blank uses suite
        required: false
        default: ''
      source_sha:
        description: Exact repository commit; blank uses the triggering commit
        required: false
        default: ''
      queued_run_id:
        description: Internal source run for one deferred accepted plan
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: nightmare-orchestrator-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: scripts
  RUNNER_IMAGE: ghcr.io/axvonx/charmos-x86-env@sha256:2f77dec0b8a479bdfb8f9237ceb0c10320e418c5725592033cd9451e63fced87
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  SUITE_ID: ${{ inputs.suite || 'overnight_locks' }}
  BATCH_ID: ${{ inputs.batch_id || format('run-{0}', github.run_id) }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      accepted: ${{ steps.result.outputs.accepted }}
      deferred: ${{ steps.result.outputs.deferred }}
      build_matrix: ${{ steps.result.outputs.build_matrix }}
      source_sha: ${{ steps.result.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download one claimed accepted plan
        if: inputs.queued_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: nightmare-queue
          path: queued-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.queued_run_id }}

      - name: Restore one claimed accepted plan
        if: inputs.queued_run_id != ''
        run: |
          cp queued-plan/command.json command.json
          cp queued-plan/snapshot.json snapshot.json
          cp queued-plan/plan.json plan.json

      - name: Prepare inline ad-hoc planner inputs
        if: inputs.queued_run_id == '' && inputs.batch_toml != ''
        env:
          BATCH_TOML: ${{ inputs.batch_toml }}
        run: |
          python3 -m charm nightmare inline-command \
            --toml "$BATCH_TOML" \
            --repository "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            --command-out command.json \
            --snapshot-out snapshot.json

      - name: Prepare repository-owned planner inputs
        if: inputs.queued_run_id == '' && inputs.batch_toml == ''
        run: |
          python3 -m charm nightmare repository-command \
            --suite "$SUITE_ID" \
            --repository "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            --command-out command.json \
            --snapshot-out snapshot.json

      - name: Validate and place
        if: inputs.queued_run_id == ''
        run: |
          ownership=repository
          if [ -n "${{ inputs.batch_toml }}" ]; then ownership=ad-hoc; fi
          set +e
          python3 -m charm nightmare plan command.json snapshot.json \
            --source-commit "$SOURCE_SHA" \
            --runner-image "$RUNNER_IMAGE" \
            --ownership "$ownership" \
            --out plan.json
          plan_rc=$?
          set -e
          test "$(jq -r '.kind' plan.json)" = accepted
          test "$plan_rc" -eq 0

      - name: Classify immediate or deferred execution
        id: timing
        run: |
          deferred=false
          if [ -z "${{ inputs.queued_run_id }}" ] && [ -n "${{ inputs.batch_toml }}" ]; then
            deferred=$(python3 -m charm nightmare queue-command command.json \
              --batch-id "$BATCH_ID" \
              --source-sha "$(jq -r '.plan.source.commit' plan.json)" \
              --out queue.json)
          fi
          echo "deferred=$deferred" >> "$GITHUB_OUTPUT"

      - name: Export the bounded accepted plan
        id: result
        run: |
          kind=$(jq -r '.kind' plan.json)
          if [ "$kind" = accepted ]; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
            echo "deferred=${{ steps.timing.outputs.deferred }}" >> "$GITHUB_OUTPUT"
            matrix=$(python3 -m charm nightmare matrix build plan.json)
            echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(jq -r '.plan.source.commit' plan.json)" >> "$GITHUB_OUTPUT"
          else
            echo 'accepted=false' >> "$GITHUB_OUTPUT"
            echo 'build_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            {
              echo '## Nightmare plan was not accepted'
              echo
              echo '```json'
              jq . plan.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Persist deferred accepted plan for the periodic waker
        if: steps.timing.outputs.deferred == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightmare-queue
          path: |
            command.json
            snapshot.json
            plan.json
            queue.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload authoritative plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightmare-plan
          path: |
            command.json
            snapshot.json
            plan.json
            attempt.json
          if-no-files-found: ignore
          retention-days: 30

  build:
    needs: plan
    if: needs.plan.outputs.accepted == 'true' && needs.plan.outputs.deferred != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:2f77dec0b8a479bdfb8f9237ceb0c10320e418c5725592033cd9451e63fced87
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: nightmare-plan
          path: plan-download

      - name: Compile exactly one accepted build group
        run: |
          python3 -m charm nightmare build-bundle plan-download/plan.json \
            --group "${{ matrix.bundle_id }}" \
            --build-dir build-orchestrator \
            --out-dir bundle \
            --receipt receipt.json

      - name: Upload immutable build bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            bundle/
            receipt.json
          retention-days: 7

  materialize:
    needs: [plan, build]
    if: always() && needs.plan.outputs.accepted == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      runner_matrix: ${{ steps.matrix.outputs.runner_matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nightmare-plan
          path: plan-download

      - uses: actions/download-artifact@v4
        with:
          pattern: nightmare-build-*
          path: builds

      - name: Materialize only from accepted receipts
        run: |
          receipts=(builds/*/receipt.json)
          python3 -m charm nightmare materialize \
            plan-download/plan.json "${receipts[@]}" \
            --out-dir materialized

      - name: Export bounded runner matrix
        id: matrix
        run: |
          matrix=$(python3 -m charm nightmare matrix runner materialized/plan_bundle.json)
          echo "runner_matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nightmare-plan-bundle
          path: materialized/
          retention-days: 30

  runner:
    needs: [plan, materialize]
    if: needs.materialize.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.materialize.outputs.runner_matrix) }}
    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:2f77dec0b8a479bdfb8f9237ceb0c10320e418c5725592033cd9451e63fced87
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: nightmare-plan-bundle
          path: plan-bundle

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.bundle_artifact }}
          path: build-download

      - name: Execute one immutable manifest
        run: |
          python3 -m charm nightmare run-manifest \
            "plan-bundle/manifests/${{ matrix.manifest_id }}.json" \
            --bundle build-download/bundle \
            --build-dir unused-build-dir \
            --out-dir runner-result

      - name: Retain result even when infrastructure failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.manifest_artifact }}
          path: runner-result/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [plan, build, materialize, runner]
    if: always() && needs.plan.outputs.accepted == 'true' && needs.plan.outputs.deferred != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nightmare-plan
          path: plan-download

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nightmare-plan-bundle
          path: plan-bundle

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: nightmare-build-*
          path: builds

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: nightmare-result-*
          path: results

      - name: Verify completeness and render findings
        run: |
          extra=()
          [ ! -f plan-bundle/plan_bundle.json ] || extra+=(--plan-bundle plan-bundle/plan_bundle.json)
          [ ! -d builds ] || extra+=(--builds-dir builds)
          python3 -m charm nightmare aggregate \
            plan-download/plan.json results \
            "${extra[@]}" \
            --json nightmare-report.json \
            --markdown nightmare-summary.md \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightmare-report
          path: |
            nightmare-report.json
            nightmare-summary.md
          if-no-files-found: warn
          retention-days: 90

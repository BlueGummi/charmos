name: Test

# Runs every push
on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'include/**'
  pull_request:
    paths:
      - 'kernel/**'
      - 'include/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Runs often, release runners
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_TIMEOUT: 300
  ITERATIONS: 4

jobs:
  test:
    name: Test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:f65d35505d3e48ffe00651fd5da9a7568c2b266d3acd142c6d38f89ec4d57d1e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Compile
        run: ./scripts/build.sh -t RelWithDebInfo --compiler ${{ matrix.compiler }} -C

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.compiler }}
          path: build/charmos-x86_64.iso
          retention-days: 7

      - name: Run tests
        env:
          TERM: dumb
        run: >
          uv run --locked charm boot "$ITERATIONS"
          --timeout "$TEST_TIMEOUT"
          --out-dir results
          --shard ${{ matrix.compiler }}
          --scenario gate
          --compiler ${{ matrix.compiler }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.compiler }}
          path: results/
          retention-days: 14

  report:
    name: Report
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: artifacts

      - name: Parse and aggregate
        run: |
          uv run --locked charm ci aggregate 'artifacts/**/*.ndjson' \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json report.json \
            --fail-on-error

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: report.json
          retention-days: 30

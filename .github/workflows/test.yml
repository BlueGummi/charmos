name: Test

on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'include/**'
  pull_request:
    paths:
      - 'kernel/**'
      - 'include/**'
  workflow_dispatch: # manual trigger
  workflow_run:
    workflows: ["Update CI Container"]
    types:
      - completed

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  test:
    name: Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    container:
      image: ghcr.io/axvonx/charmos-x86-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install clang toolchain
        if: matrix.compiler == 'clang'
        run: apt-get update && apt-get install -y clang lld

      - name: Compile
        run: ./scripts/build.sh -t RelWithDebInfo --compiler ${{ matrix.compiler }} -C

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.compiler }}
          path: build/charmos-x86_64.iso
          retention-days: 7

      - name: Run tests
        env:
          TERM: dumb
          TEST_TIMEOUT: 300
        run: |
          cd build
          for i in $(seq 1 4); do
            echo "[INFO] (${{ matrix.compiler }}) Test iteration $i/4"

            set +e
            cmake --build . --target tests > qemu.log 2>&1 &
            make_pid=$!

            # Watchdog: on a hang, grab a backtrace off QEMU's gdbstub while the
            # VM is still alive, then tear it down.
            waited=0
            while kill -0 "$make_pid" 2>/dev/null; do
              if [ "$waited" -ge "$TEST_TIMEOUT" ]; then
                echo "[FAIL] Iteration $i timed out after ${TEST_TIMEOUT}s, collecting GDB backtrace..."
                gdb -batch -x "../scripts/gdb_script" kernel/kernel || true
                pkill -f qemu-system-x86_64
                wait "$make_pid"
                cat qemu.log
                exit 1
              fi
              sleep 1
              waited=$((waited + 1))
            done

            wait "$make_pid"
            rc=$?
            set -e

            cat qemu.log

            if [ "$rc" -ne 0 ]; then
              echo "[FAIL] Iteration $i failed (exit $rc)"
              exit 1
            fi
            echo "[PASS] Iteration $i passed!"
          done

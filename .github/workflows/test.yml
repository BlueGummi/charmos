name: Test

# Runs every push
on:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'include/**'
  pull_request:
    paths:
      - 'kernel/**'
      - 'include/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Update CI Container"]
    types:
      - completed

permissions:
  contents: read

# Runs often, release runners
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_TIMEOUT: 300
  ITERATIONS: 4

jobs:
  test:
    name: Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    container:
      image: ghcr.io/axvonx/charmos-x86-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_KEY }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install clang toolchain
        if: matrix.compiler == 'clang'
        run: apt-get update && apt-get install -y clang lld

      - name: Compile
        run: ./scripts/build.sh -t RelWithDebInfo --compiler ${{ matrix.compiler }} -C

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.compiler }}
          path: build/charmos-x86_64.iso
          retention-days: 7

      - name: Run tests
        env:
          TERM: dumb
        run: |
          set -uo pipefail
          # GitHub runs under bash -e, capturing a non-zero return code
          # from timeout/QEMU requires errexit off
          set +e
          mkdir -p results
          overall=0

          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::iteration $i/$ITERATIONS (${{ matrix.compiler }})"
            start=$(date +%s)

            # --foreground lets timeout signal the whole thing 
            timeout --foreground -k 10 "$TEST_TIMEOUT" \
                cmake --build build --target tests
            rc=$?
            pkill -f qemu-system-x86_64 2>/dev/null || true

            end=$(date +%s)
            cp build/output.log "results/iter-$i.log" 2>/dev/null || \
                echo "(no serial log produced)" > "results/iter-$i.log"
            cp build/output.stderr.log "results/iter-$i.stderr.log" 2>/dev/null || true
            cp build/ndjson.log "results/iter-$i.nd.log" 2>/dev/null || true

            # This container has no python3, so parsing
            # happens in the report job
            {
              echo "SHARD=${{ matrix.compiler }}-iter$i"
              echo "COMPILER=${{ matrix.compiler }}"
              echo "SCENARIO=gate"
              echo "SEED="
              echo "EXIT_CODE=$rc"
              echo "DURATION_S=$((end - start))"
              echo "SHA=${{ github.sha }}"
            } > "results/iter-$i.env"

            tail -40 "results/iter-$i.log" || true
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              echo "::error::iteration $i failed (exit $rc)"
              overall=$rc
              break
            fi
          done

          gzip -9 results/*.log
          exit "$overall"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.compiler }}
          path: results/
          retention-days: 14

  report:
    name: Report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: artifacts

      - name: Parse and aggregate
        run: |
          set -euo pipefail
          mkdir -p ndjson
          shopt -s nullglob globstar

          for env_file in artifacts/**/*.env; do
            unset SHARD COMPILER SCENARIO SEED EXIT_CODE DURATION_S SHA
            # shellcheck disable=SC1090
            . "$env_file"
            base="${env_file%.env}"
            if [ -f "$base.log.gz" ]; then gunzip -f "$base.log.gz"; fi
            if [ -f "$base.nd.log.gz" ]; then gunzip -f "$base.nd.log.gz"; fi
            [ -f "$base.log" ] || continue
            if [ ! -f "$base.nd.log" ]; then
              echo "::error::$SHARD produced no NDJSON"
              : > "$base.nd.log"
            fi

            python3 scripts/ci/parse_log.py "$base.log" \
              --ndjson "$base.nd.log" \
              --shard "$SHARD" \
              --scenario "$SCENARIO" \
              --seed "${SEED:-}" \
              --sha "$SHA" \
              --compiler "$COMPILER" \
              --exit-code "$EXIT_CODE" \
              --duration-s "$DURATION_S" \
              --out "ndjson/$SHARD.ndjson"
          done

          python3 scripts/ci/aggregate.py 'ndjson/*.ndjson' \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json report.json \
            --fail-on-error

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.json
          retention-days: 30

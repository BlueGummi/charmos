name: Publish CI Container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/axvonx/charmos-x86-env

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: publish
        run: |
          set -euo pipefail
          tag="$IMAGE:sha-${GITHUB_SHA}"
          docker build -t "$tag" . -f scripts/Dockerfile
          docker push "$tag"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record digest for the user-reviewed pin
        run: |
          echo '### Published runner image' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'Update workflow image references in a separate user-reviewed commit.' >> "$GITHUB_STEP_SUMMARY"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charmos-tools"
version = "0.1.0"
description = "Host-side tooling for the charmOS kernel"
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=5",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
charm = "charm.cli:main"

[tool.setuptools]
package-dir = { "" = "scripts" }

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["charm*"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.ruff]
src = ["scripts"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Long lines in message strings read better
    "E501",
    # Flags typographically correct dashes
    "RUF001",
]

[tool.ruff.format]
exclude = ["scripts/brepl.py", "scripts/tagscan.py"]

[tool.mypy]
files = ["scripts/charm"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
